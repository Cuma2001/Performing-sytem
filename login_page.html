<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="http://127.0.0.1:8000/favicon.ico" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Vite compiled assets (includes Tailwind + auth.css) -->
    <link rel="preload" as="style" href="http://127.0.0.1:8000/build/assets/app-5ZqG7HQu.css" /><link rel="modulepreload" as="script" href="http://127.0.0.1:8000/build/assets/app-BjMeHjpC.js" /><link rel="stylesheet" href="http://127.0.0.1:8000/build/assets/app-5ZqG7HQu.css" /><script type="module" src="http://127.0.0.1:8000/build/assets/app-BjMeHjpC.js"></script>

</head>
<body>
<div class="loader-wrapper">
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<span class="loading">Loading...</span>
</div>
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-pic js-tilt" data-tilt>
                    <img src="http://127.0.0.1:8000/assets/images/img-01.png" alt="IMG">
                </div>
                <form class="login100-form validate-form" id ="loginForm" action="http://127.0.0.1:8000/loginStore"  method="post">
                <input type="hidden" name="_token" value="9rrQGQCx2XXqmSC275d9rfr6ccCyCiKu84hN2GYd" autocomplete="off"> <!-- <input type="hidden" name="_token" value="9rrQGQCx2XXqmSC275d9rfr6ccCyCiKu84hN2GYd" autocomplete="off"> -->
                <div class="login100-pic js-tilt" data-tilt>
                        <img style="width: 300px" src="http://127.0.0.1:8000/images/logo3.png" alt="IMG">
                    </div>
                    <span class="login100-form-title">
                       Performing Management System
                    </span>
                                                           <div class="wrap-input100 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                        <input class="input100" type="text" name="email" placeholder="Email">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100">
                            <i class="fa fa-envelope" aria-hidden="true"></i>
                        </span>
                    </div>
                    <div class="wrap-input100 validate-input" data-validate="Password is required">
                        <input class="input100" type="password" name="password" placeholder="Password">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100">
                            <i class="fa fa-lock" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div class="container-login100-form-btn">
                        <div class="overlay"> <div class="spinner"></div></div>

                        <button style="background-color: rgb(6, 6, 102)" data-style="expand-right" type="submit" id = "btnSubmit" class=" login100-form-btn buttonload" onclick = "return Login()" >

                        Login
                        </button>

                    </div>
                   <div class="text-center p-t-12">
                        <a class="txt2" href="http://127.0.0.1:8000/password/reset">
                            Forgot Password?
                        </a>
                        <span class="txt1">
                            |
                        </span>
                        <a class="txt2" href="http://127.0.0.1:8000/registerUser">
                            Register?
                        </a>
                    </div>
                    <div class="text-center p-t-136">

                    </div>
                </form>
            </div>
        </div>
    </div>
<script >


    function Login() {
            $("#btnSubmit").html('<i class="fa fa-spinner fa-spin"></i>Loading...');
           $("#loginForm").submit();
        }

</script>

    
    <script>
        window.addEventListener('load', function(){
            var lw = document.querySelector('.loader-wrapper');
            if (!lw) return;
            lw.style.transition = 'opacity 0.6s ease';
            lw.style.opacity = '0';
            setTimeout(function(){ lw.style.display = 'none'; }, 650);
        });
    </script>
    <!-- Load required libraries from CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tilt.js/1.2.1/tilt.jquery.min.js"></script>

    <script>
        // Initialize tilt and ensure loader hidden
        window.addEventListener('load', function(){
            if (typeof jQuery !== 'undefined' && jQuery.fn.tilt) {
                jQuery('.js-tilt').tilt({ scale: 1.1 });
            }
        });
    </script>
